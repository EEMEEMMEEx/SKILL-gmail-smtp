<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="16" y1="16" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="96" height="96" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Card -->
  <rect x="6" y="6" width="84" height="84" rx="22" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Inner Glow Accent -->
  <rect x="8" y="8" width="80" height="80" rx="20" fill="none" stroke="rgba(59, 130, 246, 0.25)" stroke-width="1.5"/>
  
  <!-- Mail Envelope Icon -->
  <g transform="translate(24, 26)">
    <rect width="48" height="36" x="0" y="4" rx="6" stroke="url(#blueGrad)" stroke-width="3.5" fill="rgba(37, 99, 235, 0.1)"/>
    <path d="M0 10 L24 26 L48 10" stroke="url(#blueGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Shield Badge Check -->
  <g transform="translate(56, 54)">
    <circle cx="14" cy="14" r="14" fill="#0F172A" stroke="url(#emeraldGrad)" stroke-width="2.5"/>
    <path d="M9 14 L12.5 17.5 L19 10.5" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
